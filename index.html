<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dark Matter Fit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14122B; --panel:#1E1B3D; --panel2:#282452; --line:#3A3570;
  --ink:#F1EEFF; --ink2:#C3BDE8; --muted:#8F89BE;
  --flame:#FF6A3D; --mint:#4FE0A8; --gold:#FFC94A; --hp:#FF5C7A;
  --c-strength:#8270E6; --c-bike:#F25C2E; --c-other:#25A574; --c-tread:#3A8FD9;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1200px 600px at 80% -200px,#2B2560 0,transparent 70%),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
h1{font-size:2rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:.4em 0}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.small{font-size:.875rem}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}

/* Layout */
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
main{padding:20px 16px calc(96px + var(--safe-b));max-width:760px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:rgba(20,18,43,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.75rem;border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] svg{color:var(--flame)}
.brand{display:none}
@media (min-width:980px){
  .app{grid-template-columns:240px 1fr}
  nav.tabs{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 14px;background:transparent}
  nav.tabs button{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:1rem;justify-content:flex-start}
  nav.tabs button[aria-current="page"]{background:var(--panel)}
  .brand{display:block;font-family:var(--display);font-weight:800;font-size:1.3rem;padding:0 14px 22px;line-height:1.05}
  .brand span{display:block;color:var(--flame)}
  main{padding:36px 32px 60px;max-width:1040px}
  .cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
}

/* Surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
.card.tight{padding:14px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--flame);border-color:var(--flame);color:#1A0E08}
.btn.primary:hover{filter:brightness(1.08)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#062419}
.btn.ghost{background:transparent}
.btn.big{min-height:58px;font-size:1.15rem;padding:14px 26px;font-family:var(--display)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.875rem}
.btn.danger{border-color:#6b2a3a;color:#FF9DB0}
.iconbtn{background:var(--panel2);border:1px solid var(--line);width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:.85rem;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* Header strip */
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.date{color:var(--muted);font-size:.9rem}
.hud{display:flex;gap:8px;align-items:center}
.hudpill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700}
.hudpill svg{width:20px;height:20px}
.xpbar{height:10px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--flame));border-radius:999px;transition:width .8s cubic-bezier(.2,.8,.2,1)}

/* Boss */
.boss{position:relative;overflow:hidden;background:linear-gradient(160deg,#2A1F55 0%,#1E1B3D 60%);}
.boss-inner{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center}
svg.monster{width:120px;height:120px;display:block}
.boss .hpbar{height:16px;border-radius:999px;background:#3A1730;overflow:hidden;border:1px solid #5B2645;margin:8px 0 4px}
.boss .hpbar i{display:block;height:100%;background:var(--hp);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.boss-name{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1}
.monster.hit{animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.monster .body{animation:breathe 3.2s ease-in-out infinite;transform-origin:60px 100px}
@keyframes breathe{50%{transform:scale(1.03,.97)}}

/* Mission */
.mission{border-color:#4B3F8F}
.mission .kind{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ink2)}
.mission h2{font-size:1.9rem;margin:6px 0 4px}
.exlist{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.why{border-left:3px solid var(--flame);padding:6px 12px;color:var(--ink2);margin:10px 0 0;font-style:italic}

/* Quests */
.quest{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.qbar{grid-column:1/-1;height:6px;border-radius:999px;background:var(--panel2);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--mint)}
.quest.done .qtitle{color:var(--mint)}

/* Plan */
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0 4px}
.phase{padding:10px;border-radius:var(--r-sm);background:var(--panel2);font-size:.85rem;border:1px solid transparent}
.phase b{display:block;font-family:var(--display);font-size:1rem}
.phase.now{border-color:var(--flame);background:#3A2340}
.weekgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:.75rem;color:var(--muted);text-align:center}
.day{min-height:84px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;font-size:.75rem;line-height:1.2;overflow:hidden}
.day .dn{font-weight:700;font-size:.85rem;color:var(--ink2)}
.day.today{border-color:var(--flame);box-shadow:0 0 0 1px var(--flame) inset}
.day.past{opacity:.75}
.day .bar{height:4px;border-radius:2px;margin-top:auto}
.day .st{font-size:.7rem;font-weight:700}
.st.done{color:var(--mint)} .st.skipped{color:var(--gold)} .st.missed{color:#FF9DB0}
@media (max-width:520px){.day{min-height:72px;padding:5px 4px}.day .tn{display:none}}

/* Library */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.excard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:6px;min-height:110px}
.excard:hover{border-color:var(--muted)}
.excard.hidden{opacity:.45}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:11px 16px;margin-bottom:10px}
ol.steps{padding-left:1.3em;margin:.4em 0}
ol.steps li{margin:.35em 0}
ul.cues{padding-left:1.1em;margin:.4em 0}

/* Forms */
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:.85rem;color:var(--ink2);margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--flame)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(8,6,20,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media(min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:24px 24px 0 0;width:100%;max-width:620px;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + var(--safe-b));animation:up .25s cubic-bezier(.2,.8,.2,1)}
@media(min-width:700px){.sheet{border-radius:24px}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* Player */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;overflow:auto}
.p-top{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.p-prog{flex:1;height:8px;border-radius:999px;background:var(--panel2);overflow:hidden}
.p-prog i{display:block;height:100%;background:var(--flame);transition:width .4s}
.p-body{flex:1;padding:18px 16px 120px;max-width:640px;width:100%;margin:0 auto}
.p-foot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;justify-content:center}
.p-foot .btn{flex:1;max-width:300px}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(4rem,22vw,8rem);line-height:1;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:-.03em}
.target{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;text-align:center}
.target b{font-family:var(--display);font-size:1.4rem;display:block}
.setrow{display:grid;grid-template-columns:44px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow input{text-align:center;min-height:48px;font-size:1.1rem}
.setrow .sn{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.check{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center}
.check.on{background:var(--mint);border-color:var(--mint);color:#062419}
.rest{position:fixed;inset:0;z-index:45;background:rgba(20,18,43,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.ring{width:240px;height:240px}
.banner{background:#3A2340;border:1px solid var(--flame);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px}
.segs{display:flex;gap:3px;margin:14px 0}
.segs i{flex:1;height:8px;border-radius:3px;background:var(--panel2)}
.segs i.done{background:var(--muted)} .segs i.cur{background:var(--flame)}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.8rem;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:3;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--panel2);border-radius:var(--r-md);padding:12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.8rem;color:var(--muted)}
.milestones{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.milestones i{height:12px;border-radius:3px;background:var(--panel2);position:relative}
.milestones i.on{background:var(--mint)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--panel2);display:block}
.hbar{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.hbar .track{height:14px;background:var(--panel2);border-radius:0 4px 4px 0}
.hbar .track i{display:block;height:100%;border-radius:0 4px 4px 0}

/* Trophies */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{background:var(--panel2);border-radius:var(--r-md);padding:12px;text-align:center;border:1px solid var(--line)}
.badge .ic{font-size:1.9rem;line-height:1.2;filter:grayscale(1);opacity:.35}
.badge.got{border-color:var(--gold);background:#2E2747}
.badge.got .ic{filter:none;opacity:1}
.badge b{display:block;font-size:.9rem;margin-top:4px}
.badge small{color:var(--muted);font-size:.75rem;display:block;line-height:1.3}
.levelcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lvl{width:86px;height:86px;border-radius:24px;background:linear-gradient(145deg,var(--gold),var(--flame));color:#1A0E08;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;line-height:1}
.lvl small{font-size:.75rem;font-weight:700}
.lvl b{font-size:2.4rem}

/* Photos */
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel2);border:2px solid transparent;padding:0}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:.72rem;padding:14px 6px 5px;text-align:left}
.ph.selA{border-color:var(--c-tread)} .ph.selB{border-color:var(--flame)}
.ph .tag{position:absolute;top:5px;left:5px;background:var(--ink);color:var(--bg);font-weight:800;font-size:.75rem;border-radius:6px;padding:1px 7px}
.compare{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:var(--r-md);overflow:hidden;touch-action:none}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center}
.compare .divider{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);pointer-events:none}
.side{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side .compare{aspect-ratio:3/4}
.measure{position:relative;display:inline-block;width:100%}
.measure img{width:100%;display:block;border-radius:12px}
.measure .pt{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid var(--gold);background:rgba(0,0,0,.4);pointer-events:none}
.measure svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam{position:relative;width:100%;aspect-ratio:3/4;background:#000;border-radius:var(--r-md);overflow:hidden}
.cam video,.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:7rem;color:#fff;text-shadow:0 4px 30px #000}
.cam .guide{position:absolute;left:50%;top:4%;bottom:4%;width:0;border-left:1px dashed rgba(255,255,255,.35)}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .25s;max-width:92vw;text-align:center}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{background:none;border:0;border-radius:999px;padding:7px 14px;color:var(--ink2);font-weight:700;font-size:.9rem}
.seg button.on{background:var(--ink);color:var(--bg)}
.empty{text-align:center;padding:28px 14px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:400}
.celebrate .big{font-family:var(--display);font-weight:800;font-size:3rem;color:var(--gold);line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="tabs" aria-label="Sections">
    <div class="brand">Dark Matter<span>Fit</span></div>
    <button data-view="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/></svg>Today</button>
    <button data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
    <button data-view="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Moves</button>
    <button data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progress</button>
    <button data-view="trophies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Trophies</button>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="layer"></div>

<script>
/* =========================================================
   Dark Matter Fit — single-file app. Data lives on this device
   (localStorage for logs, IndexedDB for photos).
   ========================================================= */
/* ---------- SYNC SETUP: paste your Supabase project values here ----------
   Supabase dashboard → Project Settings → API. The anon key is safe to ship

  for (const w of st.weights||[]) f['weights|'+w.date] = w;
  for (const x of st.measures||[]) f['measures|'+x.date] = x;
  for (const [k,v] of Object.entries(st.ntfy?.sent||{})) f['ntfySent|'+k] = v;
  f['s|ntfyCfg'] = {server:st.ntfy?.server||'https://ntfy.sh', topic:st.ntfy?.topic||''};
  for (const k of SCALARS) if (st[k] !== undefined && st[k] !== null) f['s|'+k] = st[k];

    const i = key.indexOf('|'), g = key.slice(0,i), k = key.slice(i+1);

    else if (g === 'measures') st.measures.push(v);
    else if (g === 'ntfySent') st.ntfy.sent[k] = v;

  for (const k of keys){

/* ---------- Plan logic ---------- */
function phaseIndex(date){ const w = Math.floor(Math.max(0, daysBetween(S.startDate, date))/7); let acc=0; for(let i=0;i<PHASES.length;i++){ acc+=PHASES[i].weeks; if(w<acc) return i; } return 3; }
function plannedKey(date){
  if (S.overrides[date] !== undefined) return S.overrides[date] === 'rest' ? null : S.overrides[date];
  if (date < S.startDate) return null;
  const pat = PATTERNS[S.profile.daysPerWeek] || PATTERNS[4];
  let k = pat[dow(date)] || null;
  if (!k) return null;
  const ph = phaseIndex(date);
  if (ph === 0 && (k==='A'||k==='B')) k = 'FULL';
  if (ph === 0 && k==='BIKEINT') k = 'BIKE';
  if (ph >= 2 && k==='TREAD' && (Math.floor(daysBetween(S.startDate,date)/7)%2===1)) k = 'TREADINT';
  return k;
}
function logsOn(date){ return S.logs.filter(l => l.date === date); }
function dayStatus(date){
  const k = plannedKey(date), t = today();
  if (logsOn(date).length) return 'done';
  if (S.skips[date]) return 'skipped';
  if (!k) return 'rest';
  if (date < t) return 'missed';
  if (date === t) return 'today';
  return 'upcoming';
}
function computeStreak(){
  let streak = 0, best = S.bestStreak||0; const t = today();
  for (let d = S.startDate; d <= t; d = addDays(d,1)){
    const st = dayStatus(d);
    if (st === 'done') streak++;

    else if (st === 'missed') streak = 0;
    best = Math.max(best, streak);

function cardioSegments(key, mins, ph){
  const segs = [];
  const add = (label, min, target) => segs.push({label, sec:Math.round(min*60), target});
  if (key === 'START5'){ add('Easy spin', 5, 'Cadence 65–75 · Resistance 25–30 · Just keep the pedals turning'); return segs; }
  const warm = 5, cool = 3, main = Math.max(6, mins - warm - cool);
  if (key === 'TREAD'){
    add('Warm-up walk', warm, `${(2.5).toFixed(1)} mph · 1% incline`);
    add('Incline walk', main, `${(2.8+ph*0.2).toFixed(1)} mph · ${3+ph*2}% incline · Hands off the rails if you can`);
    add('Cool-down', cool, '2.3 mph · 0% incline');
  } else if (key === 'TREADINT'){
    add('Warm-up walk', warm, '2.6 mph · 1% incline');
    let left = main, i = 1;
    while (left >= 4){ add(`Brisk ${i}`, 2, `${(3.2+ph*0.2).toFixed(1)} mph · 4% incline`); add(`Easy ${i}`, 2, '2.7 mph · 1% incline'); left -= 4; i++; }
    if (left > 0) add('Steady', left, '3.0 mph · 2% incline');
    add('Cool-down', cool, '2.3 mph · 0% incline');
  } else if (key === 'BIKE'){
    add('Warm-up', warm, 'Cadence 70–80 · Resistance 25–30');
    add('Steady zone 2', main, `Cadence 75–85 · Resistance ${30+ph*3}–${36+ph*3} · You can still talk in sentences`);
    add('Cool-down', cool, 'Cadence 65–75 · Resistance 20–25');
  } else if (key === 'BIKEINT'){
    add('Warm-up', warm, 'Cadence 70–80 · Resistance 25–32');
    let left = main, i = 1;
    while (left >= 3){ add(`Push ${i}`, 1, `Cadence 85–95 · Resistance ${40+ph*2}–${46+ph*2}`); add(`Recover ${i}`, 2, 'Cadence 70–80 · Resistance 28–32'); left -= 3; i++; }
    if (left > 0) add('Steady', left, 'Cadence 75–85 · Resistance 32–36');
    add('Cool-down', cool, 'Cadence 65–75 · Resistance 20–25');
  } else if (key === 'MOB'){
    const moves = ['cat_cow','hip_flexor','ham_stretch','figure4','chest_stretch','childs_pose'];
    const per = Math.max(1, Math.min(2, Math.round(Math.min(mins,15)/moves.length)));
    moves.forEach(id => segs.push({label:EX[id].name, sec:per*60, target:EX[id].steps.join(' '), exId:id}));
  }
  return segs;
}

/* ---------- Boss ---------- */
function bossFor(date){
  const ws = weekStart(date);
  const idx = Math.abs(Math.floor(daysBetween('2026-01-05', ws)/7)) % BOSSES.length;
  let hp = 0; for (let i=0;i<7;i++){ const d = addDays(ws,i); const k = plannedKey(d); if (k) hp += tplMinutes(k); }
  hp = Math.max(hp, 60);
  let dmg = 0; for (const l of S.logs) if (l.date >= ws && l.date <= addDays(ws,6)) dmg += l.minutes;
  return {...BOSSES[idx], ws, hp, dmg, left:Math.max(0, hp-dmg), defeated:dmg>=hp};
}

function confetti(){

  const c = document.createElement('canvas'); c.className='confetti'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const ctx = c.getContext('2d'), cols = ['#FF6A3D','#FFC94A','#4FE0A8','#A99BFF','#3A8FD9'];
  const P = Array.from({length:140}, () => ({x:innerWidth/2, y:innerHeight*.45, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, r:Math.random()*6+3, c:cols[Math.random()*5|0], a:Math.random()*6}));
  let f = 0; (function tick(){ ctx.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.a+=.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); ctx.restore(); }); if (++f < 140) requestAnimationFrame(tick); else c.remove(); })();

function exHistory(id){
  const out = [];
  for (const l of [...S.logs].sort((a,b)=>a.ts-b.ts)) { const sets = (l.sets||[]).filter(s=>s.exId===id && s.done); if (sets.length){ const best = sets.reduce((a,s)=> (s.weight||0)*100+s.reps > (a.weight||0)*100+a.reps ? s : a); out.push({date:l.date, weight:best.weight, reps:best.reps, allHit:sets.every(s=>s.reps>=s.target)}); } }
  return out;
}

  ${progressTab==='weight'?weightHTML():progressTab==='measure'?measureHTML():photosHTML()}`;

function weightSeries(){ return [...S.weights].sort((a,b)=>a.date<b.date?-1:1); }
function trend(series){ // exponentially smoothed trend (Hacker's Diet style, alpha 0.1/day)
  let t = null, prev = null; return series.map(p => { if (t===null) t = p.value; else { const gap = Math.max(1, daysBetween(prev, p.date)); const a = 1 - Math.pow(0.9, gap); t = t + a*(p.value - t); } prev = p.date; return {date:p.date, value:t}; });
}
function rateLbsPerWeek(series){
  const cutoff = addDays(today(), -28), pts = series.filter(p=>p.date>=cutoff);
  if (pts.length < 3) return null;
  const xs = pts.map(p=>daysBetween(pts[0].date,p.date)), ys = pts.map(p=>p.value);
  const n = xs.length, mx = xs.reduce((a,b)=>a+b)/n, my = ys.reduce((a,b)=>a+b)/n;
  let num=0, den=0; for (let i=0;i<n;i++){ num+=(xs[i]-mx)*(ys[i]-my); den+=(xs[i]-mx)**2; }
  if (!den) return null; return num/den*7;
}
function weightHTML(){
  const s = weightSeries(), P = S.profile;
  if (!s.length) return `<div class="card empty"><h2>No weigh-ins yet</h2><p>Weigh yourself first thing in the morning, after the bathroom, before eating. Daily is fine — the trend line smooths out water swings.</p><button class="btn primary" data-a="logweight" style="margin-top:10px">Log your weight</button></div>`;
  const tr = trend(s), cur = tr[tr.length-1].value, last = s[s.length-1].value;
  const lost = P.startWeight - cur, total = P.startWeight - P.goalWeight;
  const rate = rateLbsPerWeek(s);
  let proj = '—';
  if (rate && rate < -0.05){ const wks = (cur - P.goalWeight)/(-rate); proj = wks <= 0 ? 'Reached' : fmtDate(addDays(today(), Math.round(wks*7))) + ' ' + parse(addDays(today(), Math.round(wks*7))).getFullYear(); }
  const goalDays = daysBetween(S.startDate, P.goalDate), elapsed = daysBetween(S.startDate, today());
  const shouldBe = P.startWeight - total*clamp(elapsed/goalDays,0,1);
  const ahead = shouldBe - cur;
  const needRate = (cur - P.goalWeight) / Math.max(1, daysBetween(today(), P.goalDate)/7);
  const ms = Math.max(1, Math.round(total/10));
  return `<div class="card">
    <div class="statgrid">
      <div class="stat"><div class="v">${round1(last)}</div><div class="l">Latest weigh-in (lb)</div></div>
      <div class="stat"><div class="v">${round1(cur)}</div><div class="l">Trend weight (lb)</div></div>
      <div class="stat"><div class="v">${lost>=0?'−':'+'}${round1(Math.abs(lost))}</div><div class="l">Since start</div></div>
      <div class="stat"><div class="v">${round1(Math.max(0,cur-P.goalWeight))}</div><div class="l">To goal of ${P.goalWeight}</div></div>
    </div>
    <div class="row between small" style="margin-top:14px"><span class="ink2">Goal progress · each block is 10 lb</span><span class="num">${Math.round(clamp(lost/total,0,1)*100)}%</span></div>
    <div class="milestones" style="grid-template-columns:repeat(${ms},1fr)">${Array.from({length:ms},(_,i)=>`<i class="${lost>=(i+1)*10?'on':''}" title="${(i+1)*10} lb"></i>`).join('')}</div>
  </div>
  <div class="card">
    <div class="row between wrap"><h3>Weight trend</h3><div class="seg">${[['1m','1M'],['3m','3M'],['all','All']].map(([v,l])=>`<button class="${weightRange===v?'on':''}" data-a="wrange" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div class="chart" id="wchart" style="margin-top:12px"><div class="tip" id="wtip"></div></div>
    <div class="legend"><span><span class="dot" style="background:var(--ink2)"></span>Weigh-ins</span><span><span class="dot" style="background:var(--mint)"></span>Trend</span><span><span class="dot" style="background:var(--gold)"></span>Goal path</span></div>
  </div>
  <div class="card">
    <div class="statgrid">
      <div class="stat"><div class="v">${rate===null?'—':(rate<=0?'−':'+')+Math.abs(rate).toFixed(1)}</div><div class="l">lb per week (last 4 wk)</div></div>
      <div class="stat"><div class="v">${needRate>0?needRate.toFixed(1):'0'}</div><div class="l">lb/week needed for goal day</div></div>
      <div class="stat"><div class="v" style="font-size:1.2rem">${proj}</div><div class="l">Projected goal date</div></div>
      <div class="stat"><div class="v" style="color:${ahead>=0?'var(--mint)':'var(--gold)'}">${ahead>=0?'Ahead':'Behind'}</div><div class="l">${round1(Math.abs(ahead))} lb vs goal path</div></div>
    </div>
    <p class="muted small" style="margin-top:10px">1–2 lb a week is a sustainable pace. Faster than that usually costs muscle.</p>
    <div class="actions" style="margin-top:8px"><button class="btn primary" data-a="logweight">Log weight</button><button class="btn ghost" data-a="weightlist">Edit entries</button></div>
  </div>`;
}
function drawWeightChart(){
  const el = $('#wchart'); if (!el) return;
  let s = weightSeries(); const tr = trend(s); const P = S.profile;
  const from = weightRange==='1m' ? addDays(today(),-30) : weightRange==='3m' ? addDays(today(),-91) : (s[0]?.date < S.startDate ? s[0].date : S.startDate);
  const to = weightRange==='all' ? (P.goalDate) : today();
  const pts = s.filter(p=>p.date>=from), tpts = tr.filter(p=>p.date>=from);
  const W = 640, H = 280, m = {l:44, r:14, t:12, b:30};
  const x0 = parse(from).getTime(), x1 = parse(to).getTime();
  const goalLine = [{date:S.startDate, value:P.startWeight},{date:P.goalDate, value:P.goalWeight}];
  let vals = pts.map(p=>p.value).concat(tpts.map(p=>p.value));
  if (weightRange==='all') vals = vals.concat([P.startWeight, P.goalWeight]);
  let lo = Math.floor(Math.min(...vals)-2), hi = Math.ceil(Math.max(...vals)+2);
  if (hi - lo < 6){ lo -= 3; hi += 3; }
  const X = d => m.l + (parse(d).getTime()-x0)/(x1-x0||1)*(W-m.l-m.r);
  const Y = v => m.t + (hi-v)/(hi-lo)*(H-m.t-m.b);
  const ticks = []; const step = Math.max(1, Math.ceil((hi-lo)/5/5)*5); for (let v = Math.ceil(lo/step)*step; v <= hi; v += step) ticks.push(v);
  // goal path clipped to range
  const gv = d => P.startWeight + (P.goalWeight-P.startWeight)*clamp(daysBetween(S.startDate,d)/daysBetween(S.startDate,P.goalDate),0,1);
  const gFrom = from < S.startDate ? S.startDate : from;
  const xTicks = []; { const span = daysBetween(from,to); const stepD = span > 200 ? 61 : span > 60 ? 30 : 7; for (let d = from; d <= to; d = addDays(d, stepD)) xTicks.push(d); }
  el.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time with trend and goal path">
    ${ticks.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#3A3570" stroke-width="1"/><text x="${m.l-8}" y="${Y(v)+4}" fill="#8F89BE" font-size="14" text-anchor="end">${v}</text>`).join('')}
    ${xTicks.map(d=>`<text x="${X(d)}" y="${H-6}" fill="#8F89BE" font-size="14" text-anchor="middle">${fmtDate(d)}</text>`).join('')}
    <line x1="${X(gFrom)}" y1="${Y(gv(gFrom))}" x2="${X(to<P.goalDate?to:P.goalDate)}" y2="${Y(gv(to<P.goalDate?to:P.goalDate))}" stroke="var(--gold)" stroke-width="2" stroke-dasharray="6 6"/>
    ${pts.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.value)}" r="4" fill="#C3BDE8" stroke="#1E1B3D" stroke-width="2"/>`).join('')}
    ${tpts.length>1?`<polyline fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${tpts.map(p=>`${X(p.date)},${Y(p.value)}`).join(' ')}"/>`:''}
    <line id="wx" x1="0" x2="0" y1="${m.t}" y2="${H-m.b}" stroke="#C3BDE8" stroke-width="1" opacity="0"/>
    <rect x="${m.l}" y="0" width="${W-m.l-m.r}" height="${H}" fill="transparent" id="whit"/>
  </svg>`);
  const svg = $('svg', el), tip = $('#wtip'), cross = $('#wx');
  const move = ev => {
    const r = svg.getBoundingClientRect(), px = ((ev.touches?ev.touches[0].clientX:ev.clientX) - r.left) / r.width * W;
    if (!pts.length) return; let best = pts[0]; for (const p of pts) if (Math.abs(X(p.date)-px) < Math.abs(X(best.date)-px)) best = p;
    const tv = tr.find(t=>t.date===best.date);
    cross.setAttribute('x1', X(best.date)); cross.setAttribute('x2', X(best.date)); cross.setAttribute('opacity', .6);
    tip.style.display='block'; tip.style.left = (X(best.date)/W*100)+'%'; tip.style.top = (Y(best.value)/H*r.height)+'px';
    tip.textContent = `${fmtDate(best.date)}: ${best.value} lb · trend ${round1(tv.value)}`;
  };
  const leave = () => { tip.style.display='none'; cross.setAttribute('opacity',0); };
  $('#whit').addEventListener('pointermove', move); $('#whit').addEventListener('pointerleave', leave);
}

/* ---------- Photos (IndexedDB, never leaves the device) ---------- */
let DB, photoCount = 0, photoCache = [], cmp = {a:null, b:null, mode:'slider', pos:50, fade:50};
function db(){ return new Promise((res,rej)=>{ if (DB) return res(DB); const r = indexedDB.open('dmfit-photos',1); r.onupgradeneeded = () => r.result.createObjectStore('photos',{keyPath:'id'}); r.onsuccess = () => { DB = r.result; res(DB); }; r.onerror = () => rej(r.error); }); }
/* Image files live in IndexedDB (key = photo id); their details (date, pose, marks,
   alignment) live in S.photos so they can sync. */
async function idbAll(){ try{ const d = await db(); return await new Promise((res,rej)=>{ const q = d.transaction('photos').objectStore('photos').getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return []; } }
async function idbPut(rec){ const d = await db(); return new Promise((res,rej)=>{ const tx = d.transaction('photos','readwrite'); tx.objectStore('photos').put(rec); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
async function idbDel(id){ const d = await db(); return new Promise((res)=>{ const tx = d.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=res; tx.onerror=res; }); }
async function migratePhotos(){
  try{ if (localStorage.getItem('dmfit.photomig')) return; }catch(e){ return; }
  const recs = await idbAll(); let changed = false;
  for (const r of recs){ if (!S.photos[r.id]){ const {blob, ...meta} = r; S.photos[r.id] = meta; changed = true; } }
  if (changed) save();
  try{ localStorage.setItem('dmfit.photomig','1'); }catch(e){}

function restHTML(){ return `<div class="rest" id="restOv"><div class="muted">Rest</div><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#282452" stroke-width="8" fill="none"/><circle id="restArc" cx="50" cy="50" r="44" stroke="var(--mint)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0" transform="rotate(-90 50 50)"/><text id="restTxt" x="50" y="58" text-anchor="middle" fill="#F1EEFF" font-family="Bricolage Grotesque, system-ui" font-weight="800" font-size="24"></text></svg><p class="ink2">${esc(P.rest.next)}</p><div class="actions"><button class="btn" data-a="restadd">+15 s</button><button class="btn primary" data-a="restskip">Skip rest</button></div></div>`; }
function tickPlayer(){
  if (!P) return;
  const e = $('#pElapsed'); if (e) e.textContent = mmss(activeMs()/1000);
  if (P.five && !P.fivePrompted && activeMs() >= 5*60*1000){ P.fivePrompted = true; beep(880,.15,3); openModal(`${head('Five minutes done','You kept your word')}<p class="ink2">That’s the hard part over. Keep going for the full session, or finish now — either way it counts.</p><div class="actions" style="margin-top:14px"><button class="btn primary" data-a="close">Keep going</button><button class="btn" data-a="pfinish">Finish here</button></div>`); }
  if (P.pauseAt) return;
  const st = P.steps[P.i];
  if (P.rest){
    const left = (P.rest.end - Date.now())/1000; const arc = $('#restArc'), tx = $('#restTxt');
    if (arc){ arc.setAttribute('stroke-dashoffset', 276.5*(1-clamp(left/P.rest.total,0,1))); tx.textContent = mmss(left); }
    if (left <= 3 && !P.rest.warned){ P.rest.warned = true; beep(660,.1,3); }
    if (left <= 0){ const after = P.rest.after; P.rest = null; beep(1100,.25); $('#restOv')?.remove(); if (after==='next') pnext(); }
    return;
  }
  if (st.type === 'timer' && P.timer){ const left = (P.timer.end - Date.now())/1000; const c = $('#tClock'); if (c) c.textContent = mmss(left); if (left <= 0 && !P.timer.rang){ P.timer.rang = true; beep(1000,.2,2); } }

    const left = (P.seg.end - Date.now())/1000; const c = $('#sClock'); if (c) c.textContent = mmss(left);
    if (left <= 3 && left > 0 && !P.seg.warned){ P.seg.warned = true; beep(660,.08,3); }
    if (left <= 0){ if (P.seg.idx < st.segs.length-1){ P.seg = {idx:P.seg.idx+1, end:Date.now()+st.segs[P.seg.idx+1].sec*1000}; beep(1100,.3); renderPlayer(); } else { beep(1200,.2,3); P.seg.end = Infinity; finishSheet(); } }

}
function pause(){

function wipeLocal(){ try{ localStorage.removeItem(STORE_KEY); localStorage.removeItem('dmfit.photomig'); indexedDB.deleteDatabase('dmfit-photos'); }catch(e){} }
var Sync = {
  sb:null, user:null, status:'off', err:null, lastSync:null, timer:null, busy:false, again:false, channel:null, adopt:false,
  cfg(){ if (SYNC_CONFIG.url && SYNC_CONFIG.anonKey) return SYNC_CONFIG; try{ return JSON.parse(localStorage.getItem('dmfit.sbcfg')||'null'); }catch(e){ return null; } },
  configured(){ return !!this.cfg(); },
  async init(){
    const c = this.cfg(); if (!c){ this.status = 'off'; updSync(); return; }
    try{
      await loadScript(SUPABASE_JS);
      this.sb = window.supabase.createClient(c.url, c.anonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'dmfit-auth'}});
    }catch(e){ this.status = 'error'; this.err = 'Could not load the sync library — check your connection.'; updSync(); return; }
    this.sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'PASSWORD_RECOVERY') setTimeout(newPasswordSheet, 300);
      const u = session?.user || null; if ((u?.id||null) !== (this.user?.id||null)) this.setUser(u);
    });
    const {data} = await this.sb.auth.getSession();
    this.setUser(data?.session?.user || null);
  },
  setUser(u){
    this.user = u;
    if (u){ this.subscribe(); this.now(); }
    else { this.status = 'signedout'; if (this.channel){ try{ this.sb.removeChannel(this.channel); }catch(e){} this.channel = null; } }
    updSync();
  },
  subscribe(){
    if (this.channel){ try{ this.sb.removeChannel(this.channel); }catch(e){} }
    this.channel = this.sb.channel('fit-' + this.user.id)
      .on('postgres_changes', {event:'*', schema:'public', table:'fit_state', filter:'user_id=eq.' + this.user.id}, p => { if (p.new?.data?.by !== DEVICE) this.schedule(200); })
      .subscribe();
  },
  schedule(ms=1500){ if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.now(), ms); },
  async now(loud){
    if (!this.user || !this.sb) return;
    if (this.busy){ this.again = true; return; }
    this.busy = true; this.status = 'syncing'; updSync();
    try{
      const {data:row, error} = await this.sb.from('fit_state').select('data').eq('user_id', this.user.id).maybeSingle();
      if (error) throw error;
      const R = row?.data?.flat ? {flat:row.data.flat, mt:row.data.mt||{}} : null;
      stamp();
      const L = {flat:flatten(S), mt:{...S.mt}};
      let M;
      if (!R) M = L;
      else if (this.adopt) M = R;
      else { M = mergeState(L, R, false); if (!M.flat['s|photoSync']) M = mergeState(L, R, true); }
      this.adopt = false;
      if (stable(M.flat) !== stable(L.flat)){
        S = unflatten(M.flat); S.mt = M.mt; normalize(); prevStr = strings(flatten(S)); persist(); onRemoteApplied();
      } else { S.mt = M.mt; persist(); }
      // what goes up: everything, except photo details when photo sync is off (the cloud keeps its own)
      let up = M;
      if (!S.photoSync){ up = {flat:{}, mt:{}}; for (const k in M.flat) if (!k.startsWith('photos|')) up.flat[k] = M.flat[k]; for (const k in M.mt) if (!k.startsWith('photos|')) up.mt[k] = M.mt[k];
        if (R){ for (const k in R.flat) if (k.startsWith('photos|')) up.flat[k] = R.flat[k]; for (const k in R.mt) if (k.startsWith('photos|')) up.mt[k] = R.mt[k]; } }
      if (!R || stable(up) !== stable(R)){
        const {error:e2} = await this.sb.from('fit_state').upsert({user_id:this.user.id, data:{v:2, by:DEVICE, flat:up.flat, mt:up.mt}, updated_at:new Date().toISOString()});
        if (e2) throw e2;
      }
      if (S.photoSync) await this.photos();
      this.status = 'ok'; this.err = null; this.lastSync = Date.now();
      if (loud) toast('Synced');
    }catch(e){
      this.status = navigator.onLine === false ? 'offline' : 'error'; this.err = e?.message || String(e);
      if (loud) toast('Sync failed: ' + this.err);
    }
    this.busy = false; updSync();
    if (this.again){ this.again = false; this.now(); }
  },
  async photos(){
    const bucket = this.sb.storage.from('fit-photos'), base = this.user.id + '/';
    const recs = await idbAll(), have = new Map(recs.map(r => [r.id, r.blob]));
    let changed = false;
    for (const [id, m] of Object.entries(S.photos)){
      if (!have.has(id) && m.up){
        const {data, error} = await bucket.download(base + id + '.jpg');
        if (!error && data){ await idbPut({id, blob:data}); changed = true; }
      } else if (have.has(id) && !m.up){
        const {error} = await bucket.upload(base + id + '.jpg', have.get(id), {upsert:true, contentType:'image/jpeg'});
        if (!error){ S.photos[id] = {...S.photos[id], up:true}; stamp(); persist(); this.again = true; }
      }
    }
    for (const r of recs) if (!S.photos[r.id]){ await idbDel(r.id); urlCache.delete(r.id); changed = true; }
    if (changed){ photoCount = Object.keys(S.photos).length; if (VIEW === 'progress' && progressTab === 'photos' && !modalOpen() && !P) renderPhotos(); }
  },
  removePhoto(id){ if (this.user && S.photoSync && this.sb) this.sb.storage.from('fit-photos').remove([this.user.id + '/' + id + '.jpg']).catch(()=>{}); }
};
function onRemoteApplied(){ if (P) { pendingRender = true; return; } if (modalOpen()) { pendingRender = true; return; } render(); }
function syncIcon(){
  const st = Sync.status, col = {ok:'var(--mint)', syncing:'var(--gold)', error:'var(--hp)', offline:'var(--hp)', signedout:'var(--muted)', off:'var(--muted)'}[st] || 'var(--muted)';
  return `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 0-9h-1.3A7 7 0 1 0 4 15.3"/><path d="M7 19h10"/></svg><span style="position:absolute;width:10px;height:10px;border-radius:50%;background:${col};border:2px solid var(--panel2);transform:translate(11px,-11px)"></span>`;
}
function syncLabel(){
  return {ok:'Synced', syncing:'Syncing…', error:'Sync problem', offline:'Offline — will sync when back', signedout:'Not signed in', off:'Sync not set up'}[Sync.status];
}
function updSync(){
  $$('.syncbtn').forEach(b => { b.innerHTML = syncIcon(); b.style.position = 'relative'; b.setAttribute('aria-label', 'Account and sync: ' + syncLabel()); b.title = syncLabel(); });
  const st = $('#syncState'); if (st) st.innerHTML = syncStateHTML();
}
function ago(ts){ if (!ts) return 'never'; const s = Math.round((Date.now()-ts)/1000); return s < 10 ? 'just now' : s < 60 ? s + ' s ago' : s < 3600 ? Math.round(s/60) + ' min ago' : new Date(ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function syncStateHTML(){ return `<span class="row"><span class="dot" style="background:${{ok:'var(--mint)',syncing:'var(--gold)',error:'var(--hp)',offline:'var(--hp)'}[Sync.status]||'var(--muted)'}"></span><b>${syncLabel()}</b></span><span class="muted small">Last synced ${ago(Sync.lastSync)}</span>${Sync.err && Sync.status!=='ok' ? `<p class="small" style="color:#FF9DB0;margin:6px 0 0">${esc(Sync.err)}</p>` : ''}`; }

      <label class="f"><span>Email</span><input type="email" id="auEmail" autocomplete="username" inputmode="email"></label>

    <div class="card tight" id="syncState" style="background:var(--panel2);display:flex;flex-direction:column;gap:4px">${syncStateHTML()}</div>
    <p class="ink2 small">Changes sync a moment after you make them, and other signed-in devices update live. Offline? It catches up when you reconnect.</p>

    <div class="row between"><div><b>Sync progress photos</b><p class="muted small" style="margin:2px 0 0">Off: photos stay only on the device that took them. On: stored in your private Supabase storage, visible only to your account.</p></div>
      <button class="chip ${S.photoSync?'on':''}" data-a="photosync" aria-pressed="${S.photoSync}">${S.photoSync?'On':'Off'}</button></div>
    <hr>

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  const fn = ACT[a.dataset.a]; if (fn){ e.preventDefault(); fn(a, e); }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset.input; if (!k) return;
  if (k === 'libq'){ libQuery = t.value; const pos = t.selectionStart; render(); const s = $('.search'); s.focus(); s.setSelectionRange(pos,pos); }
  if (k === 'setw' || k === 'setr'){ const st = P.steps[P.i]; P.sets[st.exId][+t.dataset.j][k==='setw'?'weight':'reps'] = t.value; }
  if (k === 'cmppos'){ if (cmp.mode==='slider'){ cmp.pos = +t.value; $('#cmpB').style.clipPath = `inset(0 0 0 ${cmp.pos}%)`; $('#cmpdiv').style.left = cmp.pos+'%'; } else { cmp.fade = +t.value; $('#cmpB').style.opacity = cmp.fade/100; } }
  if (k.startsWith('al-')){ const B = photoCache.find(p=>p.id===cmp.b); if (!B) return; B.align = B.align || {s:1,x:0,y:0}; const f = k.slice(3); B.align[f] = f==='s' ? +t.value/100 : +t.value; $$('#cmpB, .side .compare:last-child img').forEach(img => img.style.transform = `translate(${B.align.x}%,${B.align.y}%) scale(${B.align.s})`); clearTimeout(B._t); B._t = setTimeout(()=>{ const {_t, ...rest} = B; photoPut(rest); }, 400); }
});

/* ---------- Boot ---------- */
load();
render();
Sync.init();
migratePhotos().then(() => { photoCount = Object.keys(S.photos).length; });
if (S.onboarded){ scheduleNudges(false); claimQuests(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible'){ Sync.schedule(100); if (!P && S.onboarded && !modalOpen()){ render(); scheduleNudges(false); } } });
</script>
